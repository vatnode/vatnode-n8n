name: CI

# Dry run of everything the release does, minus the publish — so a broken lint
# or build shows up on the commit rather than on the tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - name: Inspect the package that would be published
        run: npm pack --dry-run
